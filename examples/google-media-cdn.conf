# Include in a dedicated server. Replace the key file and example-key.
# The key name identifies the configured Media CDN keyset.

secure_link_sign on;
secure_link_sign_algorithm ed25519;
secure_link_sign_public_key /etc/nginx/keys/media-cdn.pem;

if ($request_method !~ ^(GET|HEAD)$) {
    return 403;
}

if ($request_uri !~ '^(?<media_unsigned>(?<media_resource>/[^?\x00-\x20\x22\x23\x5c\x7f-\xff]*(?<media_query>\?[^\x00-\x20\x22\x23\x5c\x7f-\xff]*)?)(?(media_query)&|\?)Expires=(?<media_expires>[0-9]+)&KeyName=example-key)&Signature=(?<media_signature>[A-Za-z0-9_-]{86}(?:==)?)$') {
    return 403;
}

if ($media_resource ~* '[?&](Expires|KeyName|Signature|URLPrefix|HeaderName|HeaderValue|IPRanges)=') {
    return 403;
}

secure_link_sign_message "$scheme://$host$media_unsigned";
secure_link_sign_check_token $media_signature digest=base64url;
secure_link_sign_check_time $media_expires range_end=0;

if ($secure_link_sign != 1) {
    return 403;
}
