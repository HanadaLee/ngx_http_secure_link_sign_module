# Include in a dedicated server. Requires ngx_var_module with the tr operation.
# Replace the key file and example-key with your trusted public key and key ID.

secure_link_sign on;
secure_link_sign_algorithm rsa-sha256;
secure_link_sign_public_key /etc/nginx/keys/cloudfront.pem;

if ($request_method !~ ^(GET|HEAD)$) {
    return 403;
}

if ($request_uri !~ '^(?<cf_resource>/[^?\x00-\x20\x22\x23\x5c\x7f-\xff]*(?<cf_query>\?[^\x00-\x20\x22\x23\x5c\x7f-\xff]*)?)(?(cf_query)&|\?)Expires=(?<cf_expires>[0-9]+)&Signature=(?<cf_signature>[A-Za-z0-9_~-]+)&Key-Pair-Id=example-key&Hash-Algorithm=SHA256$') {
    return 403;
}

if ($cf_resource ~* '[?&](Expires|Signature|Key-Pair-Id|Hash-Algorithm|Policy)=') {
    return 403;
}

var $cf_signature_base64 tr $cf_signature "-_~" "+=/";

secure_link_sign_message '{"Statement":[{"Resource":"$scheme://$host$cf_resource","Condition":{"DateLessThan":{"AWS:EpochTime":$cf_expires}}}]}';
secure_link_sign_check_token $cf_signature_base64 digest=base64;
secure_link_sign_check_time $cf_expires range_end=0;

if ($secure_link_sign != 1) {
    return 403;
}
